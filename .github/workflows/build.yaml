on: [push, pull_request]

name: scry pipeline

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check

  test:
    name: Test Suite
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -- -D warnings

  release-linux:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check, test, fmt, clippy]
    name: Release Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo build --all --release
      - run: strip target/release/scry && mv target/release/scry target/release/scry_amd64
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/scry_amd64
          draft: true

  release-macos:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check, test, fmt, clippy]
    name: Release MacOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo build --all --release
      - run: strip target/release/scry && mv target/release/scry target/release/scry_darwin
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/scry_darwin
          draft: true

  release-windows:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check, test, fmt, clippy]
    name: Release Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo build --all --release
      - run: mv target/release/scry.exe target/release/scry.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/scry.exe
          draft: true
