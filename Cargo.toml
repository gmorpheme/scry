[package]
name = "scry"
version = "0.0.2"
authors = ["gmorpheme <github@gmorpheme.net>"]
edition = "2018"

[dependencies]
xml-rs = "0.8.4"
rtf-grimoire = "0.1.1"
quick-xml = { version = "0.27.1", features = [ "serialize" ] }
serde = { version = "1.0.152", features = [ "derive" ] }
thiserror = "1.0.38"
uuid = { version = "1.2.2", features = ["v4", "serde"] }
log = "0.4.17"
lazy_static = "1.4.0"
encoding_rs = "0.8.31"
codepage = "0.1.1"
structopt = "0.3.26"
itertools = "0.10.5"
regex = "1.7.1"
json = "0.12.4"
